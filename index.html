<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Betting Trends Dashboard</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, sans-serif; padding: 15px; margin: 0; }
        h1 { text-align: center; color: #00e676; margin-bottom: 20px; font-size: 1.6rem; }
        
        /* Dark Mode Control Bar Style */
        .controls-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; background-color: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .control-item { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #b0bec5; text-transform: uppercase; font-weight: bold; }
        select, button { background-color: #2a2a2a; color: #ffffff; border: 1px solid #444; padding: 10px; font-size: 1rem; border-radius: 6px; -webkit-appearance: none; font-family: inherit; }
        select:focus, button:focus { border-color: #00e676; outline: none; }
        button { background-color: #b71c1c; color: #ffffff; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:active { background-color: #d32f2f; }
        
        /* Game Cards Layout */
        .game-card { background-color: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .matchup-header { font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .section-title { font-size: 0.9rem; color: #b0bec5; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .alert-banner { background-color: #1b5e20; color: #fff; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 10px; font-size: 0.85rem; border-left: 4px solid #00e676; }
        .no-movement-banner { background-color: #37474f; color: #cfd8dc; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 10px; font-size: 0.85rem; border-left: 4px solid #90a4ae; }
    </style>
</head>
<body>
    <h1>🏈 NFL Trend Analytics</h1>
    
    <!-- Fixed Controls Bar Interface -->
    <div class="controls-bar">
        <div class="control-item">
            <label for="week-selector">📅 Select Schedule Bracket</label>
            <select id="week-selector">
                <option value="current" selected>Current Live Board</option>
                <option value="all">Full Upcoming Schedule</option>
            </select>
        </div>
        <button id="clear-btn">🧹 Clear Tracked Openers</button>
    </div>

    <div id="games-container"></div>
    <script src="nfl_data.js?v=4"></script>
</body>
</html>
